name: Materialize Kola public media

on:
  push:
    branches: [main]
    paths:
      - materialize-public-media.mjs
      - lib/public-media.mjs
      - .github/workflows/materialize-kola-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    concurrency:
      group: materialize-kola-public-media
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download approved photographs
        run: TRIP=kolskiy-u-vody-i-pod-vodoy node materialize-public-media.mjs
      - name: Verify photographs
        run: |
          test "$(find media/kolskiy-u-vody-i-pod-vodoy -type f | wc -l)" -eq 37
          find media/kolskiy-u-vody-i-pod-vodoy -type f -size 0 -print -quit | grep -q . && exit 1 || true
      - name: Commit same-origin photographs
        run: |
          set -euo pipefail
          git config user.name "travel-journal-bot"
          git config user.email "travel-journal-bot@users.noreply.github.com"
          git add media/kolskiy-u-vody-i-pod-vodoy
          if git diff --cached --quiet; then
            echo "All public photographs are already present"
            exit 0
          fi
          git commit -m "Store Kola photographs with published site"
          git pull --rebase origin main
          git push origin HEAD:main
