name: Restore GitHub Pages DNS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-github-pages-dns.yml"

permissions:
  contents: read

concurrency:
  group: restore-github-pages-dns
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Point only the public site to GitHub Pages
        shell: node {0}
        run: |
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error("Cloudflare repository secrets are missing");

          const api = async (path, options = {}) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {})
              }
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) {
              throw new Error(`Cloudflare ${options.method || "GET"} ${path}: ${response.status} ${JSON.stringify(payload.errors || [])}`);
            }
            return payload.result;
          };

          const zones = await api(`/zones?name=owntravel.ru&account.id=${encodeURIComponent(accountId)}`);
          const zone = zones.find(item => item.name === "owntravel.ru" && item.status === "active");
          if (!zone) throw new Error("Active owntravel.ru zone was not found");

          const desiredAddresses = new Set([
            "185.199.108.153",
            "185.199.109.153",
            "185.199.110.153",
            "185.199.111.153"
          ]);
          const rootRecords = await api(`/zones/${zone.id}/dns_records?type=A&name=owntravel.ru&per_page=100`);

          for (const record of rootRecords) {
            if (record.content === "45.139.77.232") {
              await api(`/zones/${zone.id}/dns_records/${record.id}`, { method: "DELETE" });
            } else if (desiredAddresses.has(record.content) && record.proxied) {
              await api(`/zones/${zone.id}/dns_records/${record.id}`, {
                method: "PUT",
                body: JSON.stringify({ type: "A", name: "owntravel.ru", content: record.content, ttl: 1, proxied: false })
              });
            }
          }

          for (const address of desiredAddresses) {
            if (rootRecords.some(record => record.content === address)) continue;
            await api(`/zones/${zone.id}/dns_records`, {
              method: "POST",
              body: JSON.stringify({ type: "A", name: "owntravel.ru", content: address, ttl: 1, proxied: false })
            });
          }

          const wwwRecords = await api(`/zones/${zone.id}/dns_records?name=www.owntravel.ru&per_page=100`);
          const incompatible = wwwRecords.filter(record => record.type !== "CNAME");
          if (incompatible.length) throw new Error("www.owntravel.ru has a non-CNAME record; refusing to overwrite it");
          const www = wwwRecords[0];
          const wwwBody = JSON.stringify({ type: "CNAME", name: "www", content: "rvkrin2-collab.github.io", ttl: 1, proxied: false });
          if (www) {
            await api(`/zones/${zone.id}/dns_records/${www.id}`, { method: "PUT", body: wwwBody });
          } else {
            await api(`/zones/${zone.id}/dns_records`, { method: "POST", body: wwwBody });
          }

          const finalRoot = await api(`/zones/${zone.id}/dns_records?type=A&name=owntravel.ru&per_page=100`);
          const finalAddresses = finalRoot.map(record => record.content).sort();
          if (finalAddresses.some(address => address === "45.139.77.232") || [...desiredAddresses].some(address => !finalAddresses.includes(address))) {
            throw new Error(`Unexpected final root records: ${finalAddresses.join(", ")}`);
          }
          if (finalRoot.some(record => record.proxied)) throw new Error("A root record is still proxied");
          console.log("owntravel.ru now points directly to GitHub Pages; api/photos/upload records were not changed");
