name: Process trip requests

on:
  push:
    paths:
      - "requests/*.json"
      - "process-trip-requests.mjs"
      - "create-trip.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-trip-requests
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate requests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          requests=(requests/*.json)
          if ((${#requests[@]} == 0)); then
            echo "No private trip requests are committed; nothing to validate"
          else
            for request in "${requests[@]}"; do
              node validate-trip-request.mjs "$request"
            done
          fi
      - name: Create missing trip drafts
        run: node process-trip-requests.mjs
      - name: Test
        run: npm test
      - name: Commit generated drafts
        shell: bash
        run: |
          git config user.name "travel-journal-bot"
          git config user.email "travel-journal-bot@users.noreply.github.com"
          git add data/trips.json data/*/trip.json trips/*/index.html trips/*/chapters/*.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Create trip drafts from author requests"
          git push
