name: Process editorial approval

on:
  repository_dispatch:
    types: [photo_selection_approved, preview_feedback_submitted, preview_approved, publish_requested]

permissions:
  contents: write

jobs:
  save-selection:
    if: github.event.action == 'photo_selection_approved'
    runs-on: ubuntu-latest
    concurrency:
      group: editorial-selection-${{ github.event.client_payload.artifact.trip }}-${{ github.event.client_payload.artifact.chapter }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Save approved photo selection
        env:
          ARTIFACT: ${{ toJSON(github.event.client_payload.artifact) }}
        run: |
          trip=$(node -p 'JSON.parse(process.env.ARTIFACT).trip')
          chapter=$(node -p 'JSON.parse(process.env.ARTIFACT).chapter')
          mkdir -p "data/$trip"
          printf '%s\n' "$ARTIFACT" > "data/$trip/$chapter-author-review.json"
          echo "TRIP=$trip" >> "$GITHUB_ENV"
          echo "CHAPTER=$chapter" >> "$GITHUB_ENV"
      - name: Validate author approval
        run: node validate-editorial-chapter.mjs
      - name: Build storyboard from approved selection
        run: node build-storyboard.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER_ORDER: anthropic,openai
      - name: Validate storyboard
        run: node validate-storyboard.mjs
      - name: Validate editorial gates
        run: node validate-editorial-chapter.mjs
      - name: Test
        run: npm test
      - name: Commit durable author checkpoint and storyboard
        run: |
          set -euo pipefail
          git config user.name "travel-journal-bot"
          git config user.email "travel-journal-bot@users.noreply.github.com"
          git add "data/$TRIP/$CHAPTER-author-review.json" "data/$TRIP/$CHAPTER-storyboard.json"
          if git diff --cached --quiet; then
            echo "Author review and storyboard are already current"
            exit 0
          fi
          git commit -m "Save approved selection and storyboard for $TRIP $CHAPTER"
          git pull --rebase origin main
          git push origin HEAD:main

  save-feedback:
    if: github.event.action == 'preview_feedback_submitted'
    runs-on: ubuntu-latest
    concurrency:
      group: editorial-feedback-save-${{ github.event.client_payload.artifact.trip }}-${{ github.event.client_payload.artifact.chapter }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Append durable author feedback
        env:
          ARTIFACT: ${{ toJSON(github.event.client_payload.artifact) }}
        run: |
          set -euo pipefail
          trip=$(node -p 'JSON.parse(process.env.ARTIFACT).trip')
          chapter=$(node -p 'JSON.parse(process.env.ARTIFACT).chapter')
          file="data/$trip/$chapter-author-feedback.json"
          mkdir -p "data/$trip"
          ARTIFACT="$ARTIFACT" FILE="$file" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const note = JSON.parse(process.env.ARTIFACT);
          const file = process.env.FILE;
          let current = { schema_version: 1, trip: note.trip, chapter: note.chapter, notes: [] };
          if (fs.existsSync(file)) current = JSON.parse(fs.readFileSync(file, 'utf8'));
          current.schema_version = 1;
          current.trip = note.trip;
          current.chapter = note.chapter;
          current.notes = Array.isArray(current.notes) ? current.notes : [];
          const duplicate = current.notes.some(item => item.submitted_at === note.submitted_at && item.text === note.text);
          if (!duplicate) current.notes.push({ type: note.type, photo: note.photo || '', text: note.text, photos_fingerprint: note.photos_fingerprint, author_review_updated_at: note.author_review_updated_at || '', storyboard_updated_at: note.storyboard_updated_at, submitted_at: note.submitted_at });
          current.updated_at = note.submitted_at;
          fs.writeFileSync(file, JSON.stringify(current, null, 2) + '\n');
          NODE
          echo "TRIP=$trip" >> "$GITHUB_ENV"
          echo "CHAPTER=$chapter" >> "$GITHUB_ENV"
      - name: Commit feedback immediately
        run: |
          set -euo pipefail
          git config user.name "travel-journal-bot"
          git config user.email "travel-journal-bot@users.noreply.github.com"
          git add "data/$TRIP/$CHAPTER-author-feedback.json"
          if git diff --cached --quiet; then
            echo "Feedback is already saved"
            exit 0
          fi
          git commit -m "Save preview feedback for $TRIP $CHAPTER"
          git pull --rebase origin main
          git push origin HEAD:main

  rebuild-feedback:
    if: github.event.action == 'preview_feedback_submitted'
    needs: save-feedback
    runs-on: ubuntu-latest
    concurrency:
      group: editorial-feedback-rebuild-${{ github.event.client_payload.artifact.trip }}-${{ github.event.client_payload.artifact.chapter }}
      cancel-in-progress: true
    env:
      TRIP: ${{ github.event.client_payload.artifact.trip }}
      CHAPTER: ${{ github.event.client_payload.artifact.chapter }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate durable author approval
        run: node validate-editorial-chapter.mjs
      - name: Rebuild storyboard from latest saved feedback
        run: node build-storyboard.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER_ORDER: anthropic,openai
      - name: Validate storyboard
        run: node validate-storyboard.mjs
      - name: Validate editorial gates
        run: node validate-editorial-chapter.mjs
      - name: Test
        run: npm test
      - name: Commit rebuilt storyboard
        run: |
          set -euo pipefail
          git config user.name "travel-journal-bot"
          git config user.email "travel-journal-bot@users.noreply.github.com"
          git add "data/$TRIP/$CHAPTER-storyboard.json"
          if git diff --cached --quiet; then
            echo "Storyboard is already current"
            exit 0
          fi
          git commit -m "Rebuild preview from latest feedback for $TRIP $CHAPTER"
          git pull --rebase origin main
          git push origin HEAD:main

  approve-preview:
    if: github.event.action == 'preview_approved'
    runs-on: ubuntu-latest
    concurrency:
      group: editorial-approval-${{ github.event.client_payload.artifact.trip }}-${{ github.event.client_payload.artifact.chapter }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stage second author approval
        env:
          ARTIFACT: ${{ toJSON(github.event.client_payload.artifact) }}
        run: |
          trip=$(node -p 'JSON.parse(process.env.ARTIFACT).trip')
          chapter=$(node -p 'JSON.parse(process.env.ARTIFACT).chapter')
          printf '%s\n' "$ARTIFACT" > "data/$trip/$chapter-approval.json"
          echo "TRIP=$trip" >> "$GITHUB_ENV"
          echo "CHAPTER=$chapter" >> "$GITHUB_ENV"
      - name: Reject stale preview approval
        run: node validate-editorial-chapter.mjs
      - name: Commit second author approval without publishing
        run: |
          set -euo pipefail
          git config user.name "travel-journal-bot"
          git config user.email "travel-journal-bot@users.noreply.github.com"
          git add "data/$TRIP/$CHAPTER-approval.json"
          if git diff --cached --quiet; then
            echo "Preview approval is already current"
            exit 0
          fi
          git commit -m "Approve preview for $TRIP $CHAPTER"
          git pull --rebase origin main
          git push origin HEAD:main

  publish:
    if: github.event.action == 'publish_requested'
    runs-on: ubuntu-latest
    concurrency:
      group: editorial-publication-${{ github.event.client_payload.artifact.trip }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test approved source before publication
        run: npm test
      - name: Validate and build the approved public trip
        env:
          ARTIFACT: ${{ toJSON(github.event.client_payload.artifact) }}
        run: |
          trip=$(node -p 'JSON.parse(process.env.ARTIFACT).trip')
          cover=$(node -p 'JSON.parse(process.env.ARTIFACT).cover_chapter')
          TRIP="$trip" COVER_CHAPTER="$cover" node publish-trip.mjs
          node build-admin-trips.mjs
          echo "TRIP=$trip" >> "$GITHUB_ENV"
      - name: Validate generated publication
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const trip = process.env.TRIP;
          const registry = JSON.parse(fs.readFileSync('data/trips.json', 'utf8'));
          const entries = Array.isArray(registry) ? registry : (registry.trips || registry.items || []);
          const entry = entries.find(item => item.id === trip || item.trip === trip || item.slug === trip);
          if (!entry) throw new Error(`Published trip ${trip} is missing from data/trips.json`);
          if (entry.status && entry.status !== 'approved' && entry.status !== 'published') throw new Error(`Published trip ${trip} has unexpected status ${entry.status}`);
          const page = fs.readFileSync(`trips/${trip}/index.html`, 'utf8');
          if (/noindex\s*,?\s*nofollow/i.test(page)) throw new Error('Published trip page still contains noindex,nofollow');
          const journalPath = `data/${trip}/journal.json`;
          if (!fs.existsSync(journalPath)) throw new Error(`Published journal is missing: ${journalPath}`);
          const journal = JSON.parse(fs.readFileSync(journalPath, 'utf8'));
          const chapters = Array.isArray(journal.chapters) ? journal.chapters : (Array.isArray(journal.days) ? journal.days : []);
          if (!chapters.length) throw new Error('Published journal has no chapters or days');
          console.log(`Publication validation passed for ${trip}: ${chapters.length} chapter(s)`);
          NODE
      - name: Commit and publish
        run: |
          set -euo pipefail
          git config user.name "travel-journal-bot"
          git config user.email "travel-journal-bot@users.noreply.github.com"
          git add data/trips.json data/admin-trips.json "data/$TRIP" "trips/$TRIP"
          if git diff --cached --quiet; then
            echo "Published trip is already current"
            exit 0
          fi
          git commit -m "Publish approved trip $TRIP"
          git pull --rebase origin main
          git push origin HEAD:main
