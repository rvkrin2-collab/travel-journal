name: Code checks

on:
  pull_request:
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.html"
      - "test/**"
      - "worker/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.html"
      - "test/**"
      - "worker/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test
