name: Build storyboard

on:
  push:
    paths:
      - "data/*/*-author-review.json"
      - "data/*/*-author-feedback.json"
  workflow_dispatch:
    inputs:
      trip:
        description: "Canonical trip id"
        required: true
        default: "kyrgyzstan-2026"
      chapter:
        description: "Chapter slug. Legacy dayNN values are supported"
        required: true
        default: "day02"

permissions:
  contents: write

concurrency:
  group: storyboard-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve storyboard target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            trip="${{ github.event.inputs.trip }}"
            chapter="${{ github.event.inputs.chapter }}"
          else
            changed=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^data/[^/]+/[^/]+-(author-review|author-feedback)\.json$' | head -n 1)
            test -n "$changed" || { echo "No editorial source change found"; exit 1; }
            trip=$(printf '%s' "$changed" | cut -d/ -f2)
            file=$(basename "$changed")
            chapter=${file%-author-review.json}
            chapter=${chapter%-author-feedback.json}
          fi
          echo "TRIP=$trip" >> "$GITHUB_ENV"
          echo "CHAPTER=$chapter" >> "$GITHUB_ENV"
          echo "Building storyboard for $trip / $chapter"

      - name: Validate durable author approval
        run: node validate-editorial-chapter.mjs

      - name: Build storyboard
        run: node build-storyboard.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER_ORDER: anthropic,openai

      - name: Validate storyboard
        run: node validate-storyboard.mjs

      - name: Validate editorial gates
        run: node validate-editorial-chapter.mjs

      - name: Test
        run: npm test

      - name: Commit storyboard
        run: |
          set -euo pipefail
          git config user.name "travel-journal-bot"
          git config user.email "travel-journal-bot@users.noreply.github.com"
          git add "data/$TRIP/$CHAPTER-storyboard.json"
          if git diff --cached --quiet; then
            echo "No storyboard changes"
            exit 0
          fi
          git commit -m "Build storyboard for $TRIP $CHAPTER"
          git pull --rebase origin main
          git push origin HEAD:main