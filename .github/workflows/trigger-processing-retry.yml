name: Trigger trip processing retry

on:
  push:
    paths:
      - "processing-retries/*.json"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Cancel stale processing runs and dispatch fresh retry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^processing-retries/[^/]+\.json$' | head -n 1)
          test -n "$marker" || { echo "Retry marker not found"; exit 1; }
          trip=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).trip' "$marker")
          test -n "$trip" || { echo "Retry marker has no trip"; exit 1; }

          runs_json=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/process-trip-request.yml/runs?status=in_progress&per_page=20")
          stale_ids=$(printf '%s' "$runs_json" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{for(const r of JSON.parse(s).workflow_runs||[]) console.log(r.id)})')
          for run_id in $stale_ids; do
            echo "Cancelling stale processing run $run_id"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

          payload=$(node -e 'process.stdout.write(JSON.stringify({event_type:"trip_processing_retry",client_payload:{artifact:{trip:process.argv[1]}}}))' "$trip")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "$payload"
          echo "Dispatched trip_processing_retry for $trip"
