name: Trigger trip processing retry

on:
  push:
    paths:
      - "processing-retries/*.json"

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Dispatch fresh trip processing run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^processing-retries/[^/]+\.json$' | head -n 1)
          test -n "$marker" || { echo "Retry marker not found"; exit 1; }
          trip=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).trip' "$marker")
          test -n "$trip" || { echo "Retry marker has no trip"; exit 1; }
          payload=$(node -e 'process.stdout.write(JSON.stringify({event_type:"trip_processing_retry",client_payload:{artifact:{trip:process.argv[1]}}}))' "$trip")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "$payload"
          echo "Dispatched trip_processing_retry for $trip"
